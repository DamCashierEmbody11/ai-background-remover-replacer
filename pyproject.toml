[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-background-remover-replacer"
version = "0.9.3"
description = "Plugin-host desktop tool for AI background removal and replacement on Windows."
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sam", email = "sam@bgremover.dev" }]
keywords = ["background-removal", "matting", "segmentation", "onnx", "plugin-host"]

dependencies = [
    "numpy>=1.26",
    "pillow>=10.2",
    "onnxruntime>=1.17",
    "pydantic>=2.6",
    "rich>=13.7",
    "typer>=0.12",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
cuda = ["onnxruntime-gpu>=1.17"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
bgremover = "bgremover.cli:app"

[project.entry-points."bgremover.plugins"]
# External plugins register here via entry-points.
# Example: my_plugin = "my_pkg.plugin:MyPlugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["bgremover*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true